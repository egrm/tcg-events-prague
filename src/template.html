<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prague TCG Events</title>
<meta name="description" content="All trading card game events in Prague stores, in one place.">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1a1d21; --muted: #6a7280;
    --line: #e3e6ea; --accent: #2563eb; --chip: #eceff3; --chip-on: #1a1d21; --chip-on-text: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101215; --card: #1a1d21; --text: #e8eaed; --muted: #9aa3af;
      --line: #2a2e34; --accent: #7aa2ff; --chip: #23272d; --chip-on: #e8eaed; --chip-on-text: #101215;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 14px 60px; }
  header h1 { font-size: 1.5rem; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: .85rem; margin-bottom: 18px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chips .label { color: var(--muted); font-size: .8rem; align-self: center; min-width: 46px; }
  button.chip { border: 0; border-radius: 999px; padding: 5px 12px; cursor: pointer;
    background: var(--chip); color: var(--text); font-size: .82rem; }
  button.chip.on { background: var(--chip-on); color: var(--chip-on-text); }
  .day { margin-top: 22px; }
  .day h2 { font-size: .95rem; margin: 0 0 8px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; }
  .ev { display: flex; gap: 12px; background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; align-items: baseline; }
  .ev .time { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 46px; }
  .ev .body { flex: 1; min-width: 0; }
  .ev .title a { color: var(--text); text-decoration: none; font-weight: 600; }
  .ev .title a:hover { color: var(--accent); text-decoration: underline; }
  .ev .meta { color: var(--muted); font-size: .82rem; margin-top: 1px; }
  .badge { display: inline-block; font-size: .72rem; padding: 1px 8px; border-radius: 999px;
    background: color-mix(in srgb, var(--gc, #888) 18%, var(--card)); color: var(--gc, #888);
    border: 1px solid color-mix(in srgb, var(--gc, #888) 35%, transparent); white-space: nowrap; }
  .empty { color: var(--muted); margin-top: 30px; }
  footer { margin-top: 44px; border-top: 1px solid var(--line); padding-top: 18px;
    font-size: .84rem; color: var(--muted); }
  footer h3 { font-size: .9rem; color: var(--text); margin: 18px 0 6px; }
  footer a { color: var(--accent); }
  .src { margin: 3px 0; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .ok .dot { background: #3fb950; } .warn .dot { background: #d29922; }
  .err .dot { background: #f85149; } .pend .dot { background: #8b949e; }
  .feeds { display: flex; flex-wrap: wrap; gap: 6px 14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Prague TCG Events</h1>
    <div class="sub" id="refreshed"></div>
  </header>
  <div class="chips" id="gameChips"><span class="label">Games</span></div>
  <div class="chips" id="storeChips"><span class="label">Stores</span></div>
  <main id="list"></main>
  <footer>
    <h3>Data sources</h3>
    <div id="sources"></div>
    <h3>Calendar feeds (ICS)</h3>
    <div class="feeds" id="feeds"></div>
    <p>Events link to the original store pages — always check there before traveling.
       Built from public store schedules · <a href="https://github.com/egrm/tcg-events-prague">source</a></p>
  </footer>
</div>
<script>
const DATA = /*__DATA__*/null;

const GAME_COLORS = {
  mtg: '#e8712e', pokemon: '#e5c02c', onepiece: '#d64550', lorcana: '#a86ee8',
  fab: '#c23b3b', swu: '#4a90d9', riftbound: '#3bb3a9', gundam: '#5c7cfa',
  digimon: '#f2903a', yugioh: '#8d6be8', vanguard: '#2fa88c', dbfw: '#e0a12f', other: '#8b949e',
};
const SOURCE_STORE = { najada: 'najada', onyx: 'onyx', cernyrytir: 'cernyrytir', playzone: 'playzone' };

const sel = { games: new Set(), stores: new Set() };
try {
  const h = new URLSearchParams(location.hash.slice(1));
  (h.get('g') || '').split(',').filter(Boolean).forEach(g => sel.games.add(g));
  (h.get('s') || '').split(',').filter(Boolean).forEach(s => sel.stores.add(s));
} catch {}

function saveHash() {
  const h = new URLSearchParams();
  if (sel.games.size) h.set('g', [...sel.games].join(','));
  if (sel.stores.size) h.set('s', [...sel.stores].join(','));
  history.replaceState(null, '', h.size ? '#' + h : location.pathname);
}

function fmtRel(iso) {
  if (!iso) return 'never';
  const mins = Math.round((Date.now() - new Date(iso)) / 60000);
  if (mins < 60) return mins + ' min ago';
  if (mins < 48 * 60) return Math.round(mins / 60) + ' h ago';
  return Math.round(mins / 1440) + ' days ago';
}

const dayFmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Europe/Prague' });
const timeFmt = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Prague' });
const pragueDay = iso => iso.slice(0, 10);

function dayLabel(isoDate) {
  const today = new Date().toLocaleDateString('en-CA', { timeZone: 'Europe/Prague' });
  const tomorrow = new Date(Date.now() + 86400000).toLocaleDateString('en-CA', { timeZone: 'Europe/Prague' });
  const base = dayFmt.format(new Date(isoDate + 'T12:00:00+02:00'));
  if (isoDate === today) return 'Today · ' + base;
  if (isoDate === tomorrow) return 'Tomorrow · ' + base;
  return base;
}

function visible() {
  return DATA.events.filter(e =>
    (!sel.games.size || sel.games.has(e.game)) &&
    (!sel.stores.size || sel.stores.has(e.storeId)));
}

function chip(label, on, count, onClick) {
  const b = document.createElement('button');
  b.className = 'chip' + (on ? ' on' : '');
  b.textContent = count != null ? `${label} (${count})` : label;
  b.onclick = onClick;
  return b;
}

function renderChips() {
  const counts = k => DATA.events.reduce((m, e) => (m[e[k]] = (m[e[k]] || 0) + 1, m), {});
  const gc = counts('game'), sc = counts('storeId');
  const gWrap = document.getElementById('gameChips');
  const sWrap = document.getElementById('storeChips');
  gWrap.querySelectorAll('button').forEach(b => b.remove());
  sWrap.querySelectorAll('button').forEach(b => b.remove());
  for (const g of Object.keys(DATA.games).filter(g => gc[g])) {
    gWrap.append(chip(DATA.games[g], sel.games.has(g), gc[g], () => {
      sel.games.has(g) ? sel.games.delete(g) : sel.games.add(g);
      saveHash(); renderChips(); renderList();
    }));
  }
  for (const s of Object.keys(DATA.stores).filter(s => sc[s])) {
    sWrap.append(chip(DATA.stores[s].name, sel.stores.has(s), sc[s], () => {
      sel.stores.has(s) ? sel.stores.delete(s) : sel.stores.add(s);
      saveHash(); renderChips(); renderList();
    }));
  }
}

function renderList() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  const evs = visible();
  if (!evs.length) {
    list.innerHTML = '<p class="empty">No events match the current filters.</p>';
    return;
  }
  let curDay = '', dayEl = null;
  for (const e of evs) {
    const d = pragueDay(e.start);
    if (d !== curDay) {
      curDay = d;
      dayEl = document.createElement('section');
      dayEl.className = 'day';
      dayEl.innerHTML = `<h2>${dayLabel(d)}</h2>`;
      list.append(dayEl);
    }
    const store = DATA.stores[e.storeId] || { name: e.storeId };
    const el = document.createElement('article');
    el.className = 'ev';
    const meta = [store.name, e.format, e.price].filter(Boolean).join(' · ');
    el.innerHTML =
      `<div class="time">${timeFmt.format(new Date(e.start))}</div>` +
      `<div class="body"><div class="title"><a href="${e.url}" target="_blank" rel="noopener"></a></div>` +
      `<div class="meta"></div></div>` +
      `<span class="badge" style="--gc:${GAME_COLORS[e.game] || GAME_COLORS.other}"></span>`;
    el.querySelector('.title a').textContent = e.title;
    el.querySelector('.meta').textContent = meta;
    el.querySelector('.badge').textContent = DATA.games[e.game] || e.game;
    dayEl.append(el);
  }
}

function renderMeta() {
  document.getElementById('refreshed').textContent =
    `${DATA.events.length} upcoming events · next ${DATA.windowDays} days · last refreshed ${fmtRel(DATA.generatedAt)}`;

  const srcEl = document.getElementById('sources');
  for (const [id, s] of Object.entries(DATA.sources)) {
    const store = DATA.stores[SOURCE_STORE[id]] || null;
    const name = store ? store.name : (id === 'gameshub' ? 'games-hub.gg (community tournaments)' : id);
    const cls = { ok: 'ok', suspect: 'warn', error: 'err', pending: 'pend' }[s.status] || 'warn';
    const note = s.status === 'ok' ? `updated ${fmtRel(s.fetchedAt)}` :
      s.status === 'pending' ? (s.note || 'pending') :
      `${s.status}: ${s.note || ''} (last good data ${fmtRel(s.fetchedAt)})`;
    const div = document.createElement('div');
    div.className = 'src ' + cls;
    div.innerHTML = `<span class="dot"></span><b></b> — <span></span>`;
    div.querySelector('b').textContent = name;
    div.querySelector('span:last-child').textContent = `${s.eventCount} events, ${note}`;
    srcEl.append(div);
  }
  for (const [id, st] of Object.entries(DATA.stores)) {
    if (!st.noFeed) continue;
    const div = document.createElement('div');
    div.className = 'src pend';
    div.innerHTML = `<span class="dot"></span><b></b> — <span></span> <a href="${st.url}" target="_blank" rel="noopener">check here</a>`;
    div.querySelector('b').textContent = st.name;
    div.querySelector('span:not(.dot)').textContent = st.noFeed + ', not aggregated; ';
    srcEl.append(div);
  }

  const feeds = document.getElementById('feeds');
  const link = (href, label) => {
    const a = document.createElement('a');
    a.href = href; a.textContent = label;
    return a;
  };
  feeds.append(link('all.ics', 'All games'));
  const present = [...new Set(DATA.events.map(e => e.game))];
  for (const g of Object.keys(DATA.games).filter(g => present.includes(g))) {
    feeds.append(link(g + '.ics', DATA.games[g]));
  }
}

renderMeta(); renderChips(); renderList();
</script>
</body>
</html>
